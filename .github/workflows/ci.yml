name: CI
# La suite isole chaque module pour les tests legacy qui utilisent une DB globale.

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONNEMENT: developpement
      SESSION_SECRET_KEY: ci-only-not-for-production
      DATABASE_URL: sqlite:///./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dependances
        run: python -m pip install -r requirements.txt
      - name: Verifier la compilation
        run: python -m compileall -q app tests
      - name: Lancer les tests (un module par processus)
        run: |
          set -e
          for test_file in tests/test_*.py; do
            echo "===== $test_file ====="
            pytest -q "$test_file"
          done
