name: CI
# La suite isole chaque module pour les tests legacy qui utilisent une DB globale.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Annule les anciennes exécutions de la même branche lorsqu'un commit plus récent arrive.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      ENVIRONNEMENT: developpement
      SESSION_SECRET_KEY: ci-only-not-for-production
      DATABASE_URL: sqlite:///./ci.db
      GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dependances
        run: python -m pip install -r requirements.txt
      - name: Verifier le graphe des migrations Alembic
        run: python scripts/verify_migrations.py
      - name: Verifier la compilation
        run: python -m compileall -q app tests

      # Contrôler les mutations sensibles avant les smokes navigateur et la suite longue.
      - name: Diagnostiquer le montage des routes d'authentification
        run: |
          python - <<'PY'
          from app.main import app
          from app.routers import auth_router

          paths = ("/connexion/2fa", "/profil/photo", "/securite/universite", "/securite/niveau")
          for path in paths:
              app_routes = [
                  sorted(route.methods or [])
                  for route in app.routes
                  if getattr(route, "path", None) == path and hasattr(route, "methods")
              ]
              router_routes = [
                  sorted(route.methods or [])
                  for route in auth_router.router.routes
                  if getattr(route, "path", None) == path and hasattr(route, "methods")
              ]
              print(f"ROUTE_DIAGNOSTIC {path} app={app_routes} auth_router={router_routes}")
          PY
      - name: Vérifier rapidement les routes critiques et leurs protections CSRF
        run: pytest -q tests/test_release_critical_paths.py
      - name: Verifier le contrat de deploiement Render
        run: python scripts/verify_deployment_contract.py
      - name: Vérifier l'identité de release et le renderer IA
        run: python scripts/verify_release_identity.py

      - name: Smoke browser du renderer IA
        run: |
          npm init -y >/tmp/mahay-render-smoke-package.json
          npm install --no-save jsdom@24 marked@18.1.1 dompurify@3.4.17 katex@0.19.1 highlight.js@11.12.0
          python scripts/vendor_frontend_dependencies.py
          node scripts/smoke_ai_renderer.mjs
          node scripts/smoke_language_switcher.mjs
          node --check app/static/js/bilan-reprise.js
          node scripts/smoke_bilan_reprise.mjs
          node --check app/static/js/notifications-center.js
          node scripts/smoke_notifications_center.mjs
          node --check app/static/js/pwa.js
          node --check app/static/js/offline-reader.js
          node scripts/smoke_quiz_draft.mjs

      - name: Smoke navigateur responsive des cercles
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          node scripts/smoke_circle_layout.mjs
          node scripts/smoke_global_responsive.mjs
          node scripts/smoke_back_navigation.mjs
          node scripts/smoke_circle_hierarchy.mjs
          node scripts/smoke_tuteur_voice.mjs
          node scripts/smoke_revision_contrast.mjs

      - name: Lancer les tests (un module par processus)
        run: |
          set -e
          for test_file in tests/test_*.py; do
            echo "===== $test_file ====="
            timeout 300s pytest -q "$test_file"
          done

  postgres-smoke:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      ENVIRONNEMENT: developpement
      SESSION_SECRET_KEY: ci-only-not-for-production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mahay_ci
      SUPABASE_BUCKET: documents
      GIT_COMMIT: ${{ github.sha }}
      MITARIDALA_MIGRATION_CONCURRENCY_SMOKE: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mahay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mahay_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dependances
        run: python -m pip install -r requirements.txt
      - name: Préparer le contrat Supabase Storage pour le smoke test
        run: |
          python - <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          conn.autocommit = True
          cur = conn.cursor()
          # Emule les rôles Data API Supabase pendant le smoke PostgreSQL.
          # Ils doivent exister avant les migrations pour tester les grants
          # actuels et par défaut, sans créer de comptes capables de se connecter.
          for role in ("anon", "authenticated", "service_role"):
              cur.execute("SELECT 1 FROM pg_roles WHERE rolname = %s", (role,))
              if cur.fetchone() is None:
                  cur.execute(f'CREATE ROLE "{role}" NOLOGIN')
          # Simule les grants de service_role présents sur les tables Supabase.
          # La migration doit les préserver tout en retirant ceux des rôles publics.
          cur.execute(
              "ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public "
              "GRANT ALL PRIVILEGES ON TABLES TO service_role"
          )
          cur.execute(
              "ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public "
              "GRANT ALL PRIVILEGES ON SEQUENCES TO service_role"
          )
          cur.execute(
              "ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public "
              "GRANT EXECUTE ON FUNCTIONS TO service_role"
          )
          cur.execute("CREATE SCHEMA IF NOT EXISTS storage")
          cur.execute(
              """
              CREATE TABLE IF NOT EXISTS storage.buckets (
                  id text PRIMARY KEY,
                  public boolean NOT NULL DEFAULT true,
                  file_size_limit bigint,
                  allowed_mime_types text[]
              )
              """
          )
          cur.execute(
              """
              INSERT INTO storage.buckets (id, public)
              VALUES ('documents', true)
              ON CONFLICT (id) DO NOTHING
              """
          )
          cur.close()
          conn.close()
          PY
      - name: Verifier le graphe des migrations Alembic
        run: python scripts/verify_migrations.py
      - name: Appliquer toutes les migrations PostgreSQL
        run: alembic upgrade head
      - name: Rejouer les migrations pour verifier l'idempotence
        run: alembic upgrade head
      - name: Verifier la revision courante
        run: alembic current
      - name: Tester le démarrage réel et le référentiel Excel sur PostgreSQL
        run: pytest -q tests/test_postgres_referentiel_smoke.py
  docker-python-compat:
    name: Docker Python ${{ matrix.python-version }} smoke
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - name: Construire l'image avec la version Python ciblée
        run: >-
          docker build --pull
          --build-arg PYTHON_BASE_IMAGE=python:${{ matrix.python-version }}-slim
          --tag mahay-smoke:${{ matrix.python-version }} .
      - name: Démarrer le conteneur et vérifier /health
        env:
          IMAGE_TAG: mahay-smoke:${{ matrix.python-version }}
        run: |
          set -euo pipefail
          docker run --detach --name mahay-smoke \
            --publish 127.0.0.1:18080:8080 \
            --env ENVIRONNEMENT=developpement \
            --env SESSION_SECRET_KEY=ci-only-not-for-production \
            --env DATABASE_URL=sqlite:////tmp/mahay-ci.db \
            --env GIT_COMMIT="$GITHUB_SHA" \
            "$IMAGE_TAG"
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:18080/health > /tmp/mahay-health.json; then
              cat /tmp/mahay-health.json
              python -c 'import json; assert json.load(open("/tmp/mahay-health.json", encoding="utf-8"))["status"] == "ok"'
              docker exec mahay-smoke python --version
              exit 0
            fi
            if [ "$(docker inspect --format='{{.State.Running}}' mahay-smoke)" != "true" ]; then
              echo "Le conteneur s'est arrêté avant le health check."
              docker logs mahay-smoke || true
              exit 1
            fi
            sleep 2
          done
          echo "Le health check n'a pas répondu dans le délai prévu."
          docker logs mahay-smoke || true
          exit 1
      - name: Afficher les logs en cas d'échec
        if: failure()
        run: docker logs mahay-smoke || true