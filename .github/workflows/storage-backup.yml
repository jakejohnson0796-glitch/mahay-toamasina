name: Sauvegarde chiffrée Supabase Storage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mahay-storage-backup
  cancel-in-progress: false

jobs:
  storage-backup:
    name: Exporter et chiffrer tous les objets Storage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Vérifier la configuration sans afficher les secrets
        env:
          SUPABASE_URL: ${{ secrets.BACKUP_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.BACKUP_STORAGE_SERVICE_KEY }}
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${SUPABASE_URL:-}" || -z "${SUPABASE_SERVICE_KEY:-}" ]]; then
            echo "::error::BACKUP_SUPABASE_URL et BACKUP_STORAGE_SERVICE_KEY doivent être configurés."
            exit 1
          fi
          case "$SUPABASE_URL" in
            https://*) ;;
            *)
              echo "::error::BACKUP_SUPABASE_URL doit être une URL HTTPS."
              exit 1
              ;;
          esac
          if [[ ! "${AGE_RECIPIENT:-}" =~ ^age1[0-9a-z]+$ ]]; then
            echo "::error::BACKUP_AGE_RECIPIENT doit contenir une clé publique age valide (age1...)."
            exit 1
          fi

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Exporter tous les buckets et chiffrer l'archive
        env:
          SUPABASE_URL: ${{ secrets.BACKUP_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.BACKUP_STORAGE_SERVICE_KEY }}
          AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          backup_dir="${RUNNER_TEMP}/mahay-storage-plain"
          archive_file="${RUNNER_TEMP}/mahay-storage.tar.gz"
          encrypted_file="${RUNNER_TEMP}/mahay-storage.tar.gz.age"
          trap 'rm -rf "$backup_dir" "$archive_file"' EXIT
          mkdir -p "$backup_dir"

          python scripts/backup_supabase_storage.py --output "$backup_dir"
          tar -czf "$archive_file" -C "$backup_dir" .
          test -s "$archive_file"
          tar -tzf "$archive_file" >/dev/null

          age --encrypt --recipient "$AGE_RECIPIENT" --output "$encrypted_file" "$archive_file"
          test -s "$encrypted_file"
          head -n 1 "$encrypted_file" | grep -qx 'age-encryption.org/v1'

          # Les octets des documents et leur manifeste ne sont jamais publiés en clair.
          rm -rf "$backup_dir"
          rm -f "$archive_file"
          echo "Archive Storage vérifiée et chiffrée."

      - name: Publier uniquement le fichier chiffré
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mahay-storage-${{ github.run_id }}
          path: ${{ runner.temp }}/mahay-storage.tar.gz.age
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Nettoyer les fichiers temporaires du runner
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/mahay-storage-plain" "${RUNNER_TEMP}/mahay-storage.tar.gz" "${RUNNER_TEMP}/mahay-storage.tar.gz.age"
