# Fichier de config Render — https://render.com/docs/blueprint-spec
# Web Free + Render Key Value Free. Le worker IA tourne dans le processus Web
# afin de rester compatible avec le plan Free (aucun Background Worker payant).

services:
  - type: web
    name: mahay-toamasina
    runtime: docker
    plan: free
    region: frankfurt
    # MODIF : Render ne doit déployer qu'après le passage de toutes les checks CI.
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONNEMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mahay-toamasina-ai-queue
          property: connectionString
      - key: SESSION_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: documents
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_CRITIC_MODEL
        value: qwen/qwen3.8-27b
      - key: AI_ENSEMBLE_ENABLED
        value: "true"
      - key: AI_ENSEMBLE_USE_GEMINI
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: SMTP_HOTE
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_UTILISATEUR
        sync: false
      - key: SMTP_MOT_DE_PASSE
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

  # File IA rapide. PostgreSQL reste la source durable des taches.
  # noeviction evite que Redis supprime silencieusement une tache de la file.
  - type: keyvalue
    name: mahay-toamasina-ai-queue
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction
