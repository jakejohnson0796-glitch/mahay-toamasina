{% extends "base.html" %}
{% block titre %}Deposer un document — Gasy Mahay{% endblock %}
{% block contenu %}
<h2>Deposer un document</h2>
<p>Votre document sera visible publiquement seulement apres validation par un moderateur.</p>
<div class="carte-formulaire">
  {% if erreur %}<div class="erreur">{{ erreur }}</div>{% endif %}
  <form method="post" action="/documents/upload" enctype="multipart/form-data">
    <input type="hidden" name="_csrf" value="{{ jeton_csrf(request) }}">
    <label for="titre">Titre</label>
    <input type="text" id="titre" name="titre" required placeholder="ex: Partiel de Droit civil - S3">

    <label for="matiere">Matiere</label>
    <input type="text" id="matiere" name="matiere" required>

    <label for="type_document">Type de document</label>
    <select id="type_document" name="type_document">
      <option value="annale">Annale (sujet d'examen)</option>
      <option value="corrige">Corrige</option>
      <option value="fiche">Fiche de revision</option>
      <option value="cours">Support de cours</option>
    </select>

    <label for="annee">Annee</label>
    <input type="number" id="annee" name="annee" required min="2000" max="2100" value="2026">

    <label for="filiere_id">Filiere</label>
    <select id="filiere_id" name="filiere_id" required>
      {% for filiere in filieres %}
      <option value="{{ filiere.id }}">{{ filiere.nom }}</option>
      {% endfor %}
    </select>

    <label for="fichier">Fichier (PDF, Word, PowerPoint ou image scannee)</label>
    <input type="file" id="fichier" name="fichier" required accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png">

    <button class="bouton bouton-primaire bouton-form" type="submit">Envoyer</button>
  </form>
</div>
{% endblock %}
