{% extends "base.html" %}
{% block titre %}Inscription — Gasy Mahay{% endblock %}
{% block main_classe %}main-clair{% endblock %}
{% block contenu %}
<div class="contenu-clair">
<h2>Inscription</h2>
<div class="carte-formulaire">
  {% if erreur %}<div class="erreur">{{ erreur }}</div>{% endif %}
  <form method="post" action="/inscription" id="formulaire-inscription">
    <input type="hidden" name="_csrf" value="{{ jeton_csrf(request) }}">
    <label for="nom">Nom complet</label>
    <input type="text" id="nom" name="nom" required>

    <label for="telephone">Numero de telephone</label>
    <div class="champ-telephone" style="display:flex;align-items:center;gap:0.5rem;">
      <span class="stat-label" aria-hidden="true">+261</span>
      <input type="tel" id="telephone_local" inputmode="numeric" autocomplete="tel-national"
             placeholder="34 12 345 67" maxlength="12" required
             pattern="[0-9 ]*" title="9 chiffres, sans lettre ni symbole">
    </div>
    <!-- Champ reellement envoye au backend : combine +261 + les 9 chiffres
         saisis en un numero au format local ("034XXXXXXX"), meme format
         que celui deja utilise dans la base existante. La validation
         definitive et la normalisation restent faites cote SERVEUR
         (voir app/telephone.py) : ce JS n'est qu'un confort de saisie,
         jamais la source de verite. -->
    <input type="hidden" id="telephone" name="telephone">

    <label for="mot_de_passe">Mot de passe</label>
    <div class="champ-mot-de-passe">
      <input type="password" id="mot_de_passe" name="mot_de_passe" required autocomplete="new-password">
      <button type="button" class="bouton-toggle-mdp" data-cible="mot_de_passe" aria-label="Afficher le mot de passe" aria-pressed="false">👁</button>
    </div>

    <label for="role">Vous etes</label>
    <select id="role" name="role">
      <option value="etudiant" selected>Etudiant(e)</option>
      <option value="sponsor">Repetiteur / sponsor</option>
    </select>

    <!-- Bloc academique : obligatoire et en cascade UNIQUEMENT pour un
         compte etudiant (§7-8 du brief refonte academique nationale).
         Un sponsor n'a pas de parcours academique a declarer -> le bloc
         se masque et ses champs perdent leur "required" des que le role
         change (voir le JS plus bas), pour ne jamais bloquer son
         inscription sur un choix qui ne le concerne pas. -->
    <div id="bloc-academique">
      <label for="universite_id">Universite</label>
      <select id="universite_id" name="universite_id" required>
        <option value="">— choisissez votre universite —</option>
        {% for u in universites %}
        <option value="{{ u.id }}">{{ u.nom }}{% if u.ville %} ({{ u.ville }}){% endif %}</option>
        {% endfor %}
      </select>

      <label for="composante_id">Composante / etablissement</label>
      <select id="composante_id" name="composante_id" required disabled>
        <option value="">— choisissez d'abord votre universite —</option>
      </select>

      <label for="filiere_id">Parcours / Filiere</label>
      <select id="filiere_id" name="filiere_id" required disabled>
        <option value="">— choisissez d'abord votre composante —</option>
      </select>
      <!-- Mention/Domaine ne sont jamais saisis : affiches en lecture
           seule des que le parcours choisi les determine (§33 : identite
           academique deduite du parcours, jamais tapee a la main). -->
      <p class="stat-label" id="info-mention-domaine" style="display:none;"></p>

      <label for="niveau">Niveau</label>
      <select id="niveau" name="niveau" required disabled>
        <option value="">— choisissez d'abord votre parcours —</option>
        {% for n in niveaux %}
        <option value="{{ n }}">{{ n }}</option>
        {% endfor %}
      </select>
    </div>

    <button class="bouton bouton-primaire bouton-form" type="submit">Creer mon compte</button>
  </form>
</div>
<p>Deja inscrit(e) ? <a href="/connexion">Connectez-vous</a>.</p>

<script>
(function () {
  // Confort de saisie uniquement — la validation qui compte est cote
  // serveur (app/telephone.py). Objectif ici : empecher visuellement les
  // lettres/symboles des la frappe et formater "+261 XX XX XXX XX".
  const champLocal = document.getElementById("telephone_local");
  const champCache = document.getElementById("telephone");
  const formulaire = champLocal.closest("form");

  function formaterAffichage(chiffres) {
    // chiffres : chaine de 0 a 9 chiffres -> "XX XX XXX XX"
    const groupes = [chiffres.slice(0, 2), chiffres.slice(2, 4), chiffres.slice(4, 7), chiffres.slice(7, 9)];
    return groupes.filter(Boolean).join(" ");
  }

  champLocal.addEventListener("input", function () {
    // Rejette immediatement tout ce qui n'est pas un chiffre (lettres,
    // symboles) — jamais accepte a l'affichage, meme temporairement.
    const chiffres = champLocal.value.replace(/\D/g, "").slice(0, 9);
    champLocal.value = formaterAffichage(chiffres);
  });

  formulaire.addEventListener("submit", function (evenement) {
    const chiffres = champLocal.value.replace(/\D/g, "");
    if (chiffres.length !== 9) {
      evenement.preventDefault();
      champLocal.setCustomValidity("Entrez exactement 9 chiffres apres +261.");
      champLocal.reportValidity();
      return;
    }
    champLocal.setCustomValidity("");
    // Forme locale canonique "0XXXXXXXXX", coherente avec le format deja
    // stocke en base — revalidee et re-normalisee cote serveur de toute
    // facon (voir app/telephone.py).
    champCache.value = "0" + chiffres;
  });
})();

(function () {
  // Bascule afficher/masquer pour chaque champ mot de passe de la page.
  document.querySelectorAll(".bouton-toggle-mdp").forEach(function (bouton) {
    const champ = document.getElementById(bouton.dataset.cible);
    if (!champ) return;
    bouton.addEventListener("click", function () {
      const visible = champ.type === "text";
      champ.type = visible ? "password" : "text";
      bouton.textContent = visible ? "👁" : "🙈";
      bouton.setAttribute("aria-pressed", String(!visible));
      bouton.setAttribute("aria-label", visible ? "Afficher le mot de passe" : "Masquer le mot de passe");
    });
  });
})();

(function () {
  // Selecteurs academiques en cascade (§7-8 du brief refonte academique
  // nationale) : Universite -> Composante -> Filiere/Parcours -> Niveau.
  // Chaque etape charge SES options via /api/academique/... uniquement
  // apres que la precedente est choisie — jamais de saisie libre, jamais
  // de liste affichee avant que son parent ne soit connu (§26, §30).
  const roleSelect = document.getElementById("role");
  const blocAcademique = document.getElementById("bloc-academique");
  const universiteSelect = document.getElementById("universite_id");
  const composanteSelect = document.getElementById("composante_id");
  const filiereSelect = document.getElementById("filiere_id");
  const niveauSelect = document.getElementById("niveau");
  const infoMentionDomaine = document.getElementById("info-mention-domaine");
  const champsAcademiques = [universiteSelect, composanteSelect, filiereSelect, niveauSelect];

  function reinitialiserAPartir(etape) {
    // etape 1 = composante, 2 = filiere, 3 = niveau : reinitialise cette
    // etape et toutes les suivantes (une liste ne doit jamais rester
    // affichee/selectionnable si son parent vient de changer).
    if (etape <= 1) {
      composanteSelect.innerHTML = '<option value="">— choisissez d\'abord votre universite —</option>';
      composanteSelect.disabled = true;
    }
    if (etape <= 2) {
      filiereSelect.innerHTML = '<option value="">— choisissez d\'abord votre composante —</option>';
      filiereSelect.disabled = true;
      infoMentionDomaine.style.display = "none";
    }
    if (etape <= 3) {
      niveauSelect.value = "";
      niveauSelect.disabled = true;
    }
  }

  async function chargerOptions(url) {
    const reponse = await fetch(url);
    if (!reponse.ok) return [];
    return reponse.json();
  }

  universiteSelect.addEventListener("change", async function () {
    reinitialiserAPartir(1);
    if (!universiteSelect.value) return;
    const composantes = await chargerOptions(`/api/academique/universites/${universiteSelect.value}/composantes`);
    composanteSelect.innerHTML = '<option value="">— choisissez votre composante —</option>' +
      composantes.map(function (c) { return `<option value="${c.id}">${c.nom}</option>`; }).join("");
    composanteSelect.disabled = composantes.length === 0;
    if (composantes.length === 0) {
      composanteSelect.innerHTML = '<option value="">— aucune composante disponible pour l\'instant —</option>';
    }
  });

  composanteSelect.addEventListener("change", async function () {
    reinitialiserAPartir(2);
    if (!composanteSelect.value) return;
    const filieres = await chargerOptions(`/api/academique/composantes/${composanteSelect.value}/filieres`);
    filiereSelect.innerHTML = '<option value="">— choisissez votre parcours —</option>' +
      filieres.map(function (f) { return `<option value="${f.id}" data-mention="${f.mention || ''}" data-domaine="${f.domaine || ''}">${f.nom}</option>`; }).join("");
    filiereSelect.disabled = filieres.length === 0;
    if (filieres.length === 0) {
      filiereSelect.innerHTML = '<option value="">— aucun parcours disponible pour l\'instant —</option>';
    }
  });

  filiereSelect.addEventListener("change", function () {
    reinitialiserAPartir(3);
    if (!filiereSelect.value) return;
    niveauSelect.disabled = false;

    const optionChoisie = filiereSelect.selectedOptions[0];
    const mention = optionChoisie ? optionChoisie.dataset.mention : "";
    const domaine = optionChoisie ? optionChoisie.dataset.domaine : "";
    if (mention) {
      infoMentionDomaine.textContent = domaine ? `Mention : ${mention} — Domaine : ${domaine}` : `Mention : ${mention}`;
      infoMentionDomaine.style.display = "";
    } else {
      infoMentionDomaine.style.display = "none";
    }
  });

  function appliquerVisibiliteRole() {
    const estEtudiant = roleSelect.value === "etudiant";
    blocAcademique.style.display = estEtudiant ? "" : "none";
    champsAcademiques.forEach(function (champ) {
      champ.required = estEtudiant;
    });
  }
  roleSelect.addEventListener("change", appliquerVisibiliteRole);
  appliquerVisibiliteRole();
})();
</script>
</div>
{% endblock %}
