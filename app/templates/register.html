{% extends "base.html" %}
{% block titre %}Inscription — MAHAY{% endblock %}
{% block contenu %}
<h2>Inscription</h2>
<div class="carte-formulaire">
  {% if erreur %}<div class="erreur">{{ erreur }}</div>{% endif %}
  <form method="post" action="/inscription">
    <input type="hidden" name="_csrf" value="{{ jeton_csrf(request) }}">
    <label for="nom">Nom complet</label>
    <input type="text" id="nom" name="nom" required>

    <label for="telephone">Numero de telephone</label>
    <div class="champ-telephone" style="display:flex;align-items:center;gap:0.5rem;">
      <span class="stat-label" aria-hidden="true">+261</span>
      <input type="tel" id="telephone_local" inputmode="numeric" autocomplete="tel-national"
             placeholder="34 12 345 67" maxlength="12" required
             pattern="[0-9 ]*" title="9 chiffres, sans lettre ni symbole">
    </div>
    <!-- Champ reellement envoye au backend : combine +261 + les 9 chiffres
         saisis en un numero au format local ("034XXXXXXX"), meme format
         que celui deja utilise dans la base existante. La validation
         definitive et la normalisation restent faites cote SERVEUR
         (voir app/telephone.py) : ce JS n'est qu'un confort de saisie,
         jamais la source de verite. -->
    <input type="hidden" id="telephone" name="telephone">

    <label for="mot_de_passe">Mot de passe</label>
    <div class="champ-mot-de-passe">
      <input type="password" id="mot_de_passe" name="mot_de_passe" required autocomplete="new-password">
      <button type="button" class="bouton-toggle-mdp" data-cible="mot_de_passe" aria-label="Afficher le mot de passe" aria-pressed="false">👁</button>
    </div>

    <label for="role">Vous etes</label>
    <select id="role" name="role">
      <option value="etudiant" selected>Etudiant(e)</option>
      <option value="sponsor">Repetiteur / sponsor</option>
    </select>

    <label for="filiere_id">Filiere (facultatif)</label>
    <select id="filiere_id" name="filiere_id">
      <option value="">— aucune —</option>
      {% for filiere in filieres %}
      <option value="{{ filiere.id }}">{{ filiere.nom }}</option>
      {% endfor %}
    </select>

    <button class="bouton bouton-primaire bouton-form" type="submit">Creer mon compte</button>
  </form>
</div>
<p>Deja inscrit(e) ? <a href="/connexion">Connectez-vous</a>.</p>

<script>
(function () {
  // Confort de saisie uniquement — la validation qui compte est cote
  // serveur (app/telephone.py). Objectif ici : empecher visuellement les
  // lettres/symboles des la frappe et formater "+261 XX XX XXX XX".
  const champLocal = document.getElementById("telephone_local");
  const champCache = document.getElementById("telephone");
  const formulaire = champLocal.closest("form");

  function formaterAffichage(chiffres) {
    // chiffres : chaine de 0 a 9 chiffres -> "XX XX XXX XX"
    const groupes = [chiffres.slice(0, 2), chiffres.slice(2, 4), chiffres.slice(4, 7), chiffres.slice(7, 9)];
    return groupes.filter(Boolean).join(" ");
  }

  champLocal.addEventListener("input", function () {
    // Rejette immediatement tout ce qui n'est pas un chiffre (lettres,
    // symboles) — jamais accepte a l'affichage, meme temporairement.
    const chiffres = champLocal.value.replace(/\D/g, "").slice(0, 9);
    champLocal.value = formaterAffichage(chiffres);
  });

  formulaire.addEventListener("submit", function (evenement) {
    const chiffres = champLocal.value.replace(/\D/g, "");
    if (chiffres.length !== 9) {
      evenement.preventDefault();
      champLocal.setCustomValidity("Entrez exactement 9 chiffres apres +261.");
      champLocal.reportValidity();
      return;
    }
    champLocal.setCustomValidity("");
    // Forme locale canonique "0XXXXXXXXX", coherente avec le format deja
    // stocke en base — revalidee et re-normalisee cote serveur de toute
    // facon (voir app/telephone.py).
    champCache.value = "0" + chiffres;
  });
})();

(function () {
  // Bascule afficher/masquer pour chaque champ mot de passe de la page.
  document.querySelectorAll(".bouton-toggle-mdp").forEach(function (bouton) {
    const champ = document.getElementById(bouton.dataset.cible);
    if (!champ) return;
    bouton.addEventListener("click", function () {
      const visible = champ.type === "text";
      champ.type = visible ? "password" : "text";
      bouton.textContent = visible ? "👁" : "🙈";
      bouton.setAttribute("aria-pressed", String(!visible));
      bouton.setAttribute("aria-label", visible ? "Afficher le mot de passe" : "Masquer le mot de passe");
    });
  });
})();
</script>
{% endblock %}
